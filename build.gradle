plugins {
    // Loom 1.14 is the newest line that still runs on a Java 21 toolchain (1.18+ requires Java 25).
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    // Fabric GameTests live in their own source set so they are never shipped in the release jar.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "progressionrebalance" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "progressionrebalance-gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // Headless dedicated server that runs every registered GameTest and exits.
        // It deliberately does not include the client source set, which also verifies
        // that nothing client-only is loaded on a dedicated server.
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
            runDir "build/gametest"
            source sourceSets.gametest
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Unit tests. fabric-loader-junit boots Knot so tests can use (mixin-transformed) Minecraft classes.
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
    // Keep files the game writes during tests (config, logs) out of the project root.
    def testRunDir = file("build/junit-run")
    workingDir = testRunDir
    doFirst { testRunDir.mkdirs() }
}

processResources {
    // Captured at configuration time: reading `project` while the task runs is deprecated in Gradle 9.
    def modProperties = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version"   : project.loader_version
    ]
    inputs.properties modProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand modProperties
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << "-Xlint:deprecation"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    def licenseName = "LICENSE_${project.archives_base_name}.txt"
    from("LICENSE.txt") {
        rename { licenseName }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
